version: '3.9'

# Ananta DB — Production Docker Compose
# Usage:
#   1. Copy .env.example to .env and fill in all values
#   2. docker compose up -d
#   3. docker compose exec ananta-server node migrate.js

services:
  ananta-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      NODE_ENV: production
      ANANTA_JWT_SECRET: ${ANANTA_JWT_SECRET}
      INTERNAL_BROKER_KEY: ${INTERNAL_BROKER_KEY}
      KAVACHA_SHARED_SECRET: ${KAVACHA_SHARED_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANANTA_PUBLIC_URL: ${ANANTA_PUBLIC_URL}
      STUDIO_URL: ${STUDIO_URL}
      ANANTA_ADMIN_EMAIL: ${ANANTA_ADMIN_EMAIL}
      CTRL_PLANE_URL: ${CTRL_PLANE_URL}
      CTRL_PLANE_KEY: ${CTRL_PLANE_KEY}
      CTRL_PLANE_POOLER_URL: ${CTRL_PLANE_POOLER_URL}
      ALLOWED_ORIGINS: ${STUDIO_URL},${ANANTA_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  ananta-kavacha:
    build:
      context: ./kavacha
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      KAVACHA_SHARED_SECRET: ${KAVACHA_SHARED_SECRET}
    depends_on:
      ananta-server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Nginx reverse proxy (optional — use if not on Cloudflare)
