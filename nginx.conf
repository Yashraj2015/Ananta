# Ananta Production Nginx Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Setup:
#   1. Install: apt install nginx certbot python3-certbot-nginx
#   2. Copy this file to /etc/nginx/sites-available/ananta
#   3. Replace YOUR_DOMAIN with your actual domain (e.g. api.ananta.io)
#   4. Replace YOUR_STUDIO_DOMAIN with your studio domain (e.g. app.ananta.io)
#   5. Run: certbot --nginx -d YOUR_DOMAIN -d YOUR_STUDIO_DOMAIN
#   6. Enable: ln -s /etc/nginx/sites-available/ananta /etc/nginx/sites-enabled/
#   7. Reload: nginx -t && systemctl reload nginx
#
# Let's Encrypt auto-renewal (already set up by certbot):
#   crontab: 0 12 * * * certbot renew --quiet
# ──────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (enforced at nginx level, before reaching Node.js)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

# ── API Server (api.yourdomain.com → localhost:8080) ─────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;
    # Certbot will redirect this to HTTPS automatically
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # Let's Encrypt certs (certbot fills these in automatically)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"               always;
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection         "1; mode=block"      always;
    add_header Referrer-Policy          "strict-origin"       always;

    # Hide nginx version
    server_tokens off;

    # Max request body (for file uploads)
    client_max_body_size 100M;

    # ── Auth endpoints — strict rate limiting ──────────────────────────────
    location /v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── All other API routes ────────────────────────────────────────────────
    location / {
        limit_req zone=api_zone burst=200 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Timeouts for long-running operations
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Health check (no rate limit) ────────────────────────────────────────
    location /v1/health {
        proxy_pass http://127.0.0.1:8080/v1/health;
        access_log off;
    }
}

# ── Studio (app.yourdomain.com → localhost:3003) ─────────────────────────────
server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Next.js HMR websocket support (dev mode)
        proxy_read_timeout 86400s;
    }

    # Cache Next.js static assets aggressively
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Kavacha Vault (internal only — NOT exposed publicly) ─────────────────────
# Kavacha on port 4001 should NEVER be exposed to the internet.
# It is called only by the Ananta server (localhost-to-localhost).
# If you need to manage it remotely, use SSH port forwarding:
#   ssh -L 4001:localhost:4001 user@your-server
