name = "ananta-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "ANANTA_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
ANANTA_DOMAIN = "ananta.io"
ANANTA_SERVER_URL = "https://server.ananta.io"

[[routes]]
pattern = "api.ananta.io/*"
zone_name = "ananta.io"

[[routes]]
pattern = "*.db.ananta.io/*"
zone_name = "ananta.io"
